id = "silk"
name = "Silk"
description = "Silk language support: syntax highlighting, outline, brackets, indentation and the Silk language server."
version = "0.1.0"
schema_version = 1
authors = ["Julia Ortiz <94128293+julia-script@users.noreply.github.com>"]
repository = "https://github.com/silk-lang/tree-sitter-silk"

# The grammar is this repository. Bump rev to a newer main commit after grammar changes.
[grammars.silk]
repository = "https://github.com/silk-lang/tree-sitter-silk"
rev = "8da141b2710d6c28eedc1e8235e34195b133198e"

# Runs `silk lsp` from the silk tool on PATH; see src/lib.rs.
[language_servers.silk]
name = "Silk"
languages = ["Silk"]
